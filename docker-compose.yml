services:
  cakeclaw-gateway:
    image: ${GATEWAY_IMAGE}
    container_name: cakeclaw-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_PORT}:18789"
    volumes:
      - /data/workspace:/data/workspace
      - /data/state:/home/node/.openclaw
      # Telegram Token 使用专用目录，避免把 runtime.env 暴露给容器。
      - /data/etc/openclaw/telegram:/data/etc/openclaw/telegram:ro
    env_file:
      - /data/etc/openclaw/runtime.env
    environment:
      - HOME=/home/node
    mem_limit: ${GATEWAY_MEM_LIMIT}
    cpus: "${GATEWAY_CPU_LIMIT}"
    pids_limit: ${GATEWAY_PID_LIMIT}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${GATEWAY_MEM_LIMIT}
          cpus: "${GATEWAY_CPU_LIMIT}"
          pids: ${GATEWAY_PID_LIMIT}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:18789/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
