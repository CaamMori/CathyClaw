# OpenClaw 生产部署 — Docker Compose
# 结构对齐生产机真实布局（bridge 网络 + 端口映射 + mihomo 共享 gateway netns）。
# 安装脚本会：
#   1) 把 openclaw-patches/ 渲染到 /data/opt/openclaw-patches/（启动补丁 + 孤儿锁清理）
#   2) 把 docker-cli 包装渲染到 /data/opt/docker-cli/
#   3) 把 mihomo 模板渲染到 /usr/local/etc/mihomo/config.yaml
# 本文件由 scripts/install.sh 渲染生成；占位符以 ${...} 语义替换，请勿手改。

services:
  openclaw-gateway:
    image: YOUR_GATEWAY_IMAGE
    container_name: openclaw-gateway
    restart: unless-stopped
    # 启动包装器：每次启动先清孤儿锁 + 幂等注入工具调用预算补丁，再按原命令启动。
    # 不要用 user: root —— 镜像自带 USER node，root 会导致沙箱(uid 1000) 永久 EACCES。
    entrypoint: ["/data/opt/openclaw-patches/entrypoint.sh"]
    ports:
      - "127.0.0.1:18789:18789"
    volumes:
      - /data/workspace:/data/workspace
      - /data/state:/home/node/.openclaw
      - /var/run/docker.sock:/var/run/docker.sock
      # docker CLI 包装（沙箱内需 docker 但不能直接碰宿主 socket 权限）
      - /data/opt/docker-cli/docker:/usr/local/bin/docker:ro
      - /data/opt/docker-cli/docker.real:/usr/local/bin/docker.real:ro
      # 启动补丁 + 孤儿锁清理脚本（宿主机持久化，容器只读挂载）
      - /data/opt/openclaw-patches:/data/opt/openclaw-patches:rw
    env_file:
      - /data/etc/openclaw/runtime.env
    extra_hosts:
      # Telegram API 在 TUN 模式下 DNS 会污染，静态指向真实 IP 防回环。
      # 仅在启用 mihomo（境内机）时需要；海外机直连不需钉 IP，该行会被移除。
      - "api.telegram.org:YOUR_TELEGRAM_API_IP"
    # docker.sock 组权限由 group_add 解决（不要用 root）。
    # 取值：stat -c '%g' /var/run/docker.sock
    group_add:
      - "YOUR_DOCKER_GROUP_ID"
    environment:
      - HOME=/home/node
      - TZ=Asia/Shanghai
    deploy:
      resources:
        limits:
          memory: YOUR_GATEWAY_MEM_LIMIT
          cpus: "YOUR_GATEWAY_CPU_LIMIT"
          pids: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:18789/ >/dev/null || node dist/docker-healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # mihomo TUN 代理 sidecar：与 gateway 共享网络命名空间，TUN 接管容器内出站流量
  mihomo-tun:
    image: YOUR_MIHOMO_IMAGE
    container_name: mihomo-tun
    restart: unless-stopped
    network_mode: "service:openclaw-gateway"
    depends_on:
      - openclaw-gateway
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      # 由安装脚本从 templates/mihomo-config.yaml 渲染得到
      - /usr/local/etc/mihomo/config.yaml:/sub.yaml
      - mihomo-data:/root/.config/mihomo
    entrypoint: ["/mihomo"]
    command: ["-f", "/sub.yaml"]


networks:
  default:
    ipam:
      config:
        - subnet: YOUR_COMPOSE_SUBNET

volumes:
  mihomo-data:
    external: true
    name: 5a52fbee0aeacec7b6f40eb35a1d619a146ea8328e0fdf0b5846a72098684116
